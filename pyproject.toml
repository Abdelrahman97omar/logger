[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-logger"
version = "2.0.0"
description = "Robot working hours logger. Zoho mail api with cron service to send direct mail to whom may concern"
dependencies = ["pytz", "fpdf2"]

[project.scripts]
logger-install = "logger_system.install_service:main"
send-monthly-mail = "logger_system.sendMail:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
logger_system = ["*.sh", "*.py", "*.service"]
